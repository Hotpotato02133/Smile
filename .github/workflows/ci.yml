name: Smile Monorepo CI

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run prisma:generate --workspace=@smile/api

      - name: Build all workspaces (Turborepo)
        run: npm run build

      - name: Typecheck API & Shared
        run: npm run typecheck --workspace=@smile/shared && npm run typecheck --workspace=@smile/api

      - name: Run API Supertest E2E & Concurrency Tests
        run: npm run test:e2e --workspace=@smile/api
